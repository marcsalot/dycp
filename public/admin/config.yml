backend:
  name: git-gateway
  branch: main

# Uploaded images go here (accessible at /images/uploads/...)
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "News & Updates"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Excerpt (shown in post cards)", name: "excerpt", widget: "text" }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false, hint: "Optional. Appears in the news listing and at the top of the post." }
      - { label: "Body", name: "body", widget: "markdown" }
